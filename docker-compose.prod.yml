# Customer-facing distribution stack. This is
# the generic "self-host with Docker Compose on any Linux host" path, WITH a bundled Postgres -
# not what the Unraid Community Applications template uses (unraid/milepoint.xml.template ships a
# single container and expects an EXTERNAL Postgres instead, since Unraid's Compose Manager plugin
# has no standardized CA-manifest format for multi-container app stacks - confirmed while building
# this, see the commit that introduced both files). Use this file directly (e.g. via Unraid's
# Compose Manager plugin, or any other Docker host) if a bundled DB is preferred over the XML
# template's external-DB approach.
#
# Standalone file (not an override on top of docker-compose.yml): the service shape genuinely
# differs from dev, not just a few environment values - no separate frontend/mailpit/adminer/mssql
# containers, backend serves the built frontend itself (Dockerfile.prod), Caddy is optional (most
# Unraid users already run their own reverse proxy - see the "caddy" profile below).
#
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#        (add --profile caddy to also start the bundled Caddy for users without their own proxy)
# Must differ from the dev stack's "milepoint": Compose derives volume/network names from this, so
# sharing it made a `down -v` on a prod test wipe the DEV database volume (milepoint_postgres_data)
# - so every environment needs its own Compose project name.
name: milepoint-prod

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-milepoint}
      POSTGRES_USER: ${POSTGRES_USER:-milepoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-milepoint} -d ${POSTGRES_DB:-milepoint}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Serves both the API and the built frontend (static files baked into the image by
  # Dockerfile.prod, see Program.cs's UseStaticFiles()/MapFallbackToFile) - no separate
  # frontend/Caddy hop needed just to reach the web UI, unlike the dev stack.
  backend:
    image: ${MILEPOINT_IMAGE:-ghcr.io/sushiflux/milepoint}:${MILEPOINT_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DB_PROVIDER: postgres
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-milepoint};Username=${POSTGRES_USER:-milepoint};Password=${POSTGRES_PASSWORD:?}
      ConnectionStrings__Redis: redis:6379
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY fehlt in .env}
      JWT_ISSUER: ${JWT_ISSUER:-milepoint-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-milepoint-client}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@milepoint.local}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  # Optional: self-hosted speech-to-text for voice dictation - off by default, same "whisper"
  # profile convention as the dev stack (docker compose --profile whisper up -d whisper).
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:v1.10.0
    profiles: ["whisper"]
    environment:
      ASR_ENGINE: ${WHISPER_ASR_ENGINE:-faster_whisper}
      ASR_MODEL: ${WHISPER_ASR_MODEL:-large-v3-turbo}
      ASR_DEVICE: ${WHISPER_ASR_DEVICE:-cpu}
    ports:
      - "${WHISPER_PORT:-9000}:9000"
    volumes:
      - whisper_models:/root/.cache/whisper
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9000/docs"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Optional: bundled reverse proxy with automatic local-CA HTTPS - off by default, since most
  # Unraid users already run their own shared reverse proxy (SWAG/Nginx Proxy Manager) handling
  # TLS centrally for every app on their server.
  # Enable only for users without an existing reverse proxy who want instant HTTPS:
  #   docker compose -f docker-compose.prod.yml --profile caddy up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    environment:
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:-443}
    ports:
      - "${CADDY_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  whisper_models:
  caddy_data:
