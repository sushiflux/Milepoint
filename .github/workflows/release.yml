name: Release

# Four-channel model (Dev stays local):
#   vYear.Month.Commit.Prompts.Lines-nightly -> Nightly (α), public pre-release, Docker: <id>-nightly + :nightly
#   vYear.Month.Commit.Prompts.Lines-beta    -> Beta (β), public pre-release, Docker: <id>-beta + :beta (also supports legacy -rc)
#   vYear.Month.Commit                       -> Release, public release, Docker: <id> + :latest + :beta + :nightly
#
# Target scope lives in the annotated tag message as "platform: <list>" (e.g. "platform: unraid" or "all").
on:
  push:
    tags:
      - "v*"

env:
  IMAGE_NAME: ghcr.io/sushiflux/milepoint

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v5

      - name: Kanal und Zielplattform aus Tag ableiten
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"

          # Determine channel from tag suffix.
          if [[ "$tag" == *-nightly* ]]; then
            channel="Nightly"
            is_prerelease=true
            template_tag="nightly"
            five_seg="${tag%-nightly*}"
          elif [[ "$tag" == *-beta* ]]; then
            channel="Beta"
            is_prerelease=true
            template_tag="beta"
            five_seg="${tag%-beta*}"
          elif [[ "$tag" == *-rc* ]]; then
            channel="Beta"
            is_prerelease=true
            template_tag="beta"
            five_seg="${tag%-rc*}"
          else
            channel="Release"
            is_prerelease=false
            template_tag="latest"
            five_seg="$tag"
          fi

          # Derive 3-segment base version (vYear.Month.Commit) from five_seg or existing version.txt.
          base_version="$(echo "$five_seg" | awk -F. '{ if (NF >= 3) print $1 "." $2 "." $3; else print $0 }')"
          if [[ -f backend/src/Milepoint.Api/version.txt ]]; then
            committed_five_seg="$(sed -n '2p' backend/src/Milepoint.Api/version.txt | tr -d '\r')"
            if [[ -n "$committed_five_seg" && "$channel" == "Release" ]]; then
              five_seg="$committed_five_seg"
            fi
          fi

          # Re-fetch annotated tag to read "platform: ..." from its message.
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}" || true
          platform="$(git tag -l --format='%(contents)' "$tag" | sed -n 's/^platform:[[:space:]]*//p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          builds_unraid=false
          case ",${platform}," in
            ",,"|*,unraid,*|*,docker,*|*,all,*) builds_unraid=true ;;
          esac

          target_label=""
          if [[ -z "$platform" || ",${platform}," == *,all,* ]]; then
            target_label="All"
          else
            IFS=',' read -ra ids <<< "$platform"
            for id in "${ids[@]}"; do
              case "$id" in
                unraid) name="Unraid" ;;
                docker) name="Docker" ;;
                *) name="$id" ;;
              esac
              target_label="${target_label:+$target_label, }$name"
            done
          fi

          docker_tag="${tag#v}"
          case "$channel" in
            Nightly)
              display_title="${five_seg} (α) (${target_label})"
              docker_tags="${IMAGE_NAME}:${docker_tag}"$'\n'"${IMAGE_NAME}:nightly"
              ;;
            Beta)
              display_title="${five_seg} (β) (${target_label})"
              docker_tags="${IMAGE_NAME}:${docker_tag}"$'\n'"${IMAGE_NAME}:beta"
              ;;
            Release)
              display_title="${five_seg} (${target_label})"
              docker_tags="${IMAGE_NAME}:${docker_tag}"$'\n'"${IMAGE_NAME}:latest"$'\n'"${IMAGE_NAME}:beta"$'\n'"${IMAGE_NAME}:nightly"
              ;;
          esac

          {
            echo "tag=$tag"
            echo "channel=$channel"
            echo "is_prerelease=$is_prerelease"
            echo "builds_unraid=$builds_unraid"
            echo "docker_tag=$docker_tag"
            echo "template_tag=$template_tag"
            echo "base_version=$base_version"
            echo "five_seg=$five_seg"
            echo "release_name=$display_title"
            echo "docker_tags<<EOF"
            echo "$docker_tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: version.txt schreiben
        run: printf '%s\n%s\n' "${{ steps.version.outputs.base_version }}" "${{ steps.version.outputs.five_seg }}" > backend/src/Milepoint.Api/version.txt

      - name: Docker Buildx einrichten
        if: steps.version.outputs.builds_unraid == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Bei GHCR anmelden
        if: steps.version.outputs.builds_unraid == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und pushen
        if: steps.version.outputs.builds_unraid == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.prod
          push: true
          build-args: |
            MILEPOINT_CHANNEL=${{ steps.version.outputs.channel }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
          tags: ${{ steps.version.outputs.docker_tags }}

      - name: Unraid Community-Applications-Template rendern
        if: steps.version.outputs.builds_unraid == 'true'
        run: |
          sed "s/__VERSION__/${{ steps.version.outputs.template_tag }}/g" \
            unraid/milepoint.xml.template > unraid/milepoint.xml

      - name: Unraid-Template als Artefakt anhängen
        if: steps.version.outputs.builds_unraid == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unraid-template
          path: unraid/milepoint.xml

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          files: ${{ steps.version.outputs.builds_unraid == 'true' && 'unraid/milepoint.xml' || '' }}
          generate_release_notes: true
