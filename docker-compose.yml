name: milepoint

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-milepoint}
      POSTGRES_USER: ${POSTGRES_USER:-milepoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+'s official image expects a mount at /var/lib/postgresql (not .../data) so it
      # can manage a major-version-specific subdirectory itself, enabling pg_upgrade --link-style
      # in-place major upgrades without a mount-boundary in the way.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-milepoint} -d ${POSTGRES_DB:-milepoint}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Automatic Postgres backups (scripts/db-backup.sh). The stack is started at random times, so
  # this isn't a cron schedule: it dumps right after the database is reachable (= every stack
  # start), then every BACKUP_INTERVAL_HOURS while up; start.ps1 also triggers one before stopping.
  # Backups go to ./.backups/auto on the HOST (a bind mount, git-ignored via .backups/), never into
  # a Docker volume - a deleted volume (docker compose down -v) must not take its backups with it.
  # Restore with scripts/restore-db.ps1. See the global CLAUDE.md, "Database backups for local
  # Docker Compose stacks". The entrypoint strips CRs first so a CRLF checkout can't break the script.
  db-backup:
    image: postgres:18.6-alpine
    entrypoint: ["sh", "-c", "tr -d '\\r' < /scripts/db-backup.sh > /tmp/db-backup.sh && exec sh /tmp/db-backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-milepoint}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      PGDATABASE: ${POSTGRES_DB:-milepoint}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_PREFIX: milepoint
    volumes:
      - ./scripts/db-backup.sh:/scripts/db-backup.sh:ro
      - ./.backups/auto:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # MSSQL is NOT part of the everyday dev stack anymore - it only starts via the "mssql-check"
  # profile (docker compose --profile mssql-check up -d mssql, or start.ps1 -MssqlCheck), spun up
  # deliberately before an RC-Commit/V-Commit to verify the SqlServerPmDbContext provider still
  # works (see the dual-EF-Core provider setup), rather than staying resident
  # for the rest of a session the way it used to. Keeping two full DB servers running all the time
  # for a provider only occasionally exercised was wasted resources for no daily benefit - Postgres
  # alone is the dev default now (DB_PROVIDER=postgres).
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    profiles: ["mssql-check"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD fehlt in .env}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  adminer:
    image: adminer:latest
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DB_PROVIDER: ${DB_PROVIDER:-postgres}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-milepoint};Username=${POSTGRES_USER:-milepoint};Password=${POSTGRES_PASSWORD:?}
      # Only actually dialed when DB_PROVIDER=mssql - the mssql service itself only exists behind
      # the "mssql-check" profile (see its own comment above), so this connection string sits
      # unused/harmless whenever DB_PROVIDER stays at the postgres default.
      ConnectionStrings__Mssql: Server=mssql,1433;Database=${MSSQL_DB:-Milepoint};User Id=sa;Password=${MSSQL_SA_PASSWORD:?};TrustServerCertificate=True;Encrypt=False
      ConnectionStrings__Redis: redis:6379
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY fehlt in .env}
      JWT_ISSUER: ${JWT_ISSUER:-milepoint-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-milepoint-client}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: https://localhost:${CADDY_HTTPS_PORT:-443},http://localhost:${CADDY_PORT:-80},http://localhost:${FRONTEND_PORT:-5173}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@milepoint.local}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
    volumes:
      - ./backend:/src
      - backend_nuget_cache:/root/.nuget/packages
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # No hard dependency on mssql here on purpose - it's behind the "mssql-check" profile and
      # usually isn't running at all (see its own comment above). If DB_PROVIDER=mssql is set
      # without also starting that profile, the backend's own startup migration will fail loudly
      # with a connection error - that's the correct failure mode (explicit, not silently skipped).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      # Points the HMR websocket at Caddy's public HTTPS port, not Vite's internal 5173 -
      # the browser talks to Caddy (wss://), which then tunnels the upgrade through to Vite.
      VITE_HMR_CLIENT_PORT: ${CADDY_HTTPS_PORT:-443}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Optional: self-hosted speech-to-text for the voice-dictation feature. Not part of the
  # default `docker compose up` - most users stick with the browser-based (client-side) provider
  # and need no server-side transcription at all. Only starts via the "whisper" profile:
  #   docker compose --profile whisper up -d whisper   (or start.ps1 -WithWhisper)
  whisper:
    # onerahmet/openai-whisper-asr-webservice, pinned to v1.10.0 (latest stable as of 2026-09-08,
    # actively maintained - github.com/ahmetoner/whisper-asr-webservice). Pinned to an exact tag
    # for reproducibility (image is multi-GB and bundles specific model-engine versions), not
    # `:latest`. Bump the tag deliberately when a newer release is verified, same as any other
    # image in this file.
    image: onerahmet/openai-whisper-asr-webservice:v1.10.0
    profiles: ["whisper"]
    environment:
      # openai_whisper | faster_whisper | whisperx - faster_whisper (CTranslate2 backend) is the
      # default: openai_whisper (the plain PyTorch reference engine) was noticeably slow on
      # CPU-only hardware even on a strong 16-core machine (several seconds per short dictation),
      # confirmed by a real user report. faster_whisper gives the same accuracy considerably
      # faster on CPU and needs no extra setup (already bundled in this image, no HF token
      # required for the standard models used here).
      ASR_ENGINE: ${WHISPER_ASR_ENGINE:-faster_whisper}
      # Model size trades accuracy for speed/memory - "large-v3-turbo" is the default (explicit
      # user preference after "base" mis-recognized too many words during dictation, then
      # "large-v3" was noticeably slow even with faster_whisper). large-v3-turbo is a distilled
      # large-v3 with fewer decoder layers - near-identical accuracy at roughly 8x the inference
      # speed, the better tradeoff for dictation latency than full large-v3. Whisper is
      # multilingual out of the box, so German works with any of these sizes without a separate
      # language-specific model.
      ASR_MODEL: ${WHISPER_ASR_MODEL:-large-v3-turbo}
      # cuda | cpu - stays cpu by default since this machine may not have a GPU exposed to Docker.
      # To enable GPU acceleration (noticeably faster transcription):
      #   1) switch the image tag above to the "-gpu" variant, e.g. v1.10.0-gpu
      #   2) set ASR_DEVICE=cuda here (or via WHISPER_ASR_DEVICE in .env)
      #   3) add to this service:
      #        deploy:
      #          resources:
      #            reservations:
      #              devices:
      #                - driver: nvidia
      #                  count: 1
      #                  capabilities: [gpu]
      #      (requires the NVIDIA Container Toolkit installed on the Docker host)
      ASR_DEVICE: ${WHISPER_ASR_DEVICE:-cpu}
    ports:
      - "${WHISPER_PORT:-9000}:9000"
    volumes:
      # Persists downloaded model weights across container restarts/recreates - without this,
      # every fresh container re-downloads the model (100s of MB) before it can serve a request.
      - whisper_models:/root/.cache/whisper
    healthcheck:
      # No dedicated /health endpoint in this image - "/" redirects to the Swagger UI ("/docs"),
      # which responds without needing a file upload, making it a reliable liveness check.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9000/docs"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    environment:
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:-443}
    ports:
      - "${CADDY_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  mssql_data:
  backend_nuget_cache:
  frontend_node_modules:
  caddy_data:
  whisper_models:
