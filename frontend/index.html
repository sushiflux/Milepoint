<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Milepoint</title>
    <style>
      /* Matches body's bg-slate-50 / .dark background in index.css - applied natively before
         the Vite-injected stylesheet loads, so there's no flash of the browser's default white
         background while the theme class below is already correct but unstyled. */
      html {
        background: #f8fafc;
      }
      html.dark {
        background: #0b0a1a;
      }
    </style>
    <script>
      if (localStorage.getItem('pm.theme') === 'dark') {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
